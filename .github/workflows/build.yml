name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A14CE8: ${{ secrets.A14CE8 }}
          BDFCA8: ${{ secrets.BDFCA8 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A14CE8', '')
          sec_b = os.environ.get('BDFCA8', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 66fc18693355065d15ee8f7a03ef82f26adda5 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- b5c7d1d2e88d8b545d4e7a31b74253188ee2ae8ae523 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
